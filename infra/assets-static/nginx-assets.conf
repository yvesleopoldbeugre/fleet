# Serves the frontend bundle (JS/CSS/images/fonts) built by webpack,
# independently of the Fleet API server.
#
# Cache-Control mirrors server/service/frontend.go's assetCacheControl
# (unmodified, upstream Fleet code): content-hashed filenames
# (bundle-<hash>.js, logo@<hash>.png) are immutable forever; anything else
# revalidates on every request.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/javascript text/css application/javascript;

    # Matches Fleet's own hashedAssetRe (server/service/frontend.go): a "-"
    # or "@" followed by 8+ hex chars, then a dot and extension.
    location ~ "[-@][0-9a-f]{8,}\.[a-zA-Z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
        return 404;
    }
}
